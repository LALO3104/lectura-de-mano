<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lectura de mano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#22080e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una sola columna centrada — ventana de adivina con la mano, lectura en vivo, cartas de lectura y telón final a pantalla completa */
:root{
  --velvet:#22080e;
  --velvet-2:#361019;
  --gold:#e3be74;
  --gold-dim:#8f7343;
  --cream:#f5e8cf;
  --rose:#f2788a;
  --muted:#c6a796;
  --display:"IM Fell English", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;background:var(--velvet)}
body{
  margin:0;min-height:100%;
  background:
    radial-gradient(ellipse 70% 38% at 50% 30%, #e3be741c, transparent 70%),
    radial-gradient(ellipse 120% 70% at 50% 115%, #0e0306, transparent 70%),
    var(--velvet);
  color:var(--cream);
  font:16px/1.5 var(--display);
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:440px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:28px 40px;
  display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;
}
.eyebrow{margin:0;font:500 11px/1.2 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dim)}
h1{margin:6px 0 0;font:400 clamp(2.5rem,12vw,3.3rem)/1 var(--display);letter-spacing:-.01em;text-wrap:balance}
h1 em{color:var(--gold)}

/* Ventana de la adivina */
.seal{
  position:relative;width:min(76vw,290px);max-width:100%;aspect-ratio:200/260;
  border-radius:999px 999px 14px 14px;overflow:hidden;
  background:radial-gradient(ellipse 70% 55% at 50% 42%, #4a1a24 0%, var(--velvet-2) 72%);
  box-shadow:0 0 0 1px var(--gold-dim),0 0 0 6px var(--velvet),0 0 0 7px #8f734366,0 30px 60px -20px #000a;
}
.hand{position:absolute;left:5%;right:5%;top:7%;bottom:0;width:90%;height:93%}
.lit-line{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s ease}
.lit-line.lit{stroke-dashoffset:0}
.lit-line.pulse{animation:pulseLine 1.1s ease 2}
@keyframes pulseLine{50%{stroke-width:4}}
.venus{opacity:0;transition:opacity 1s ease;transform-box:fill-box;transform-origin:center}
.venus.lit{opacity:.9}
.venus.pulse{animation:venusPulse 1.1s ease 2}
@keyframes venusPulse{50%{transform:scale(1.4)}}
.scanline{
  position:absolute;left:6%;right:6%;top:8%;height:2px;z-index:2;
  background:var(--gold);box-shadow:0 0 12px 1px var(--gold);
  opacity:0;transition:opacity .5s ease;pointer-events:none;
}
.scanline::before{content:"";position:absolute;left:0;right:0;bottom:2px;height:48px;background:linear-gradient(to bottom,transparent,#e3be7424)}
.seal.scanning .scanline{opacity:1;animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{top:8%}to{top:90%}}

/* Lectura en vivo */
.readout{width:min(76vw,290px);max-width:100%;display:grid;gap:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:500 12px/1.35 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.status{margin:0;min-width:0;text-align:left}
.pct{margin:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:2px;background:#8f734340;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.hint{margin:0;font:italic 1.05rem/1.4 var(--display);color:var(--muted)}

/* Cartas de lectura */
.readings{list-style:none;margin:0;padding:0;width:100%;display:grid;text-align:left}
.reading{padding:16px 2px;border-top:1px solid #8f734355;display:grid;gap:5px;animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.reading:last-child{border-bottom:1px solid #8f734355}
.label{font:500 11px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.reading[data-line="heart"] .label,.reading[data-line="venus"] .label{color:var(--rose)}
.reading p{margin:0;font:italic 1.3rem/1.35 var(--display);color:var(--cream);text-wrap:pretty}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.cta{
  margin-top:6px;font:italic 1.35rem/1 var(--display);color:var(--gold);
  background:transparent;border:1px solid var(--gold);border-radius:2px;
  outline:1px solid #8f734388;outline-offset:4px;
  padding:16px 30px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  animation:rise .8s both,breathe 2.4s ease-in-out 1s infinite;
}
@keyframes breathe{50%{box-shadow:0 0 26px #e3be7450}}
.cta:active{background:var(--gold);color:var(--velvet)}
@media (hover:hover){.cta:hover{background:var(--gold);color:var(--velvet)}}
.cta:focus-visible{outline:2px solid var(--cream)}
.foot{margin:6px 0 0;font:400 10.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim)}

/* Telón final */
.destino{
  position:fixed;inset:0;z-index:20;overflow-y:auto;
  background:#16050af0;display:grid;place-items:center;
  padding-top:calc(24px + env(safe-area-inset-top,0px));
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.destino canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.carta{
  position:relative;z-index:1;width:min(100%,360px);
  background:radial-gradient(ellipse 90% 60% at 50% 0%, #4d1b26, var(--velvet-2) 70%);
  border:1px solid var(--gold);
  box-shadow:inset 0 0 0 7px var(--velvet-2),inset 0 0 0 8px #8f7343aa,0 40px 80px -20px #000;
  padding:40px 28px 26px;text-align:center;display:grid;gap:14px;justify-items:center;
  animation:flip 1s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes flip{from{opacity:0;transform:perspective(900px) rotateY(80deg) scale(.9)}to{opacity:1;transform:none}}
.carta svg{width:38px;height:38px}
.carta h2{margin:0;font:400 clamp(2rem,9vw,2.5rem)/1.05 var(--display);color:var(--cream);text-wrap:balance}
.carta h2 em{color:var(--gold)}
.dtext{margin:0;font:1.2rem/1.45 var(--display);color:var(--cream);max-width:28ch;text-wrap:pretty}
.compat{margin:2px 0 0;font:500 12px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.compat b{font-weight:500;display:inline-block;min-width:3.2ch;text-align:left;font-variant-numeric:tabular-nums}
.compat b.inf{font-size:1.5em;line-height:.6;animation:venusPulse 1s ease}
.firma{margin:4px 0 0;font:italic 1.45rem/1.25 var(--display);color:var(--rose);text-wrap:balance}
.again{
  margin-top:8px;font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);background:none;border:0;padding:12px;cursor:pointer;
  text-decoration:underline;text-underline-offset:5px;-webkit-tap-highlight-color:transparent;
}
.again:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .seal.scanning .scanline{opacity:0}
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">Consulta privada<span id="fecha"></span></p>
    <h1>Lectura <em>de mano</em></h1>
  </header>

  <div class="seal" id="seal">
    <svg class="hand" viewBox="0 0 200 260" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <defs>
        <linearGradient id="skin" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="258">
          <stop offset="0" stop-color="#6a4334"/>
          <stop offset=".62" stop-color="#4f2a28"/>
          <stop offset="1" stop-color="#361019"/>
        </linearGradient>
        <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="258">
          <stop offset="0" stop-color="#e3be74" stop-opacity=".85"/>
          <stop offset=".7" stop-color="#e3be74" stop-opacity=".4"/>
          <stop offset="1" stop-color="#e3be74" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="venusGlow">
          <stop offset="0" stop-color="#f2788a" stop-opacity=".95"/>
          <stop offset="1" stop-color="#f2788a" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <g id="handShape">
          <rect x="54" y="44" width="25" height="86" rx="12.5"/>
          <rect x="83" y="26" width="26" height="102" rx="13"/>
          <rect x="113" y="36" width="25" height="94" rx="12.5"/>
          <rect x="141" y="64" width="21" height="72" rx="10.5" transform="rotate(8 151 120)"/>
          <rect x="26" y="118" width="28" height="80" rx="14" transform="rotate(-32 40 158)"/>
          <rect x="50" y="104" width="112" height="112" rx="36"/>
          <rect x="70" y="190" width="70" height="80"/>
        </g>
      </defs>
      <use href="#handShape" fill="none" stroke="url(#rim)" stroke-width="3"/>
      <use href="#handShape" fill="url(#skin)"/>
      <g fill="none" stroke="#e3be74" stroke-opacity=".28" stroke-width="1.6" stroke-linecap="round">
        <path d="M158 142 C 140 130, 112 140, 84 124"/>
        <path d="M56 152 C 84 156, 118 160, 150 174"/>
        <path d="M58 150 C 74 170, 70 194, 90 214"/>
        <path d="M112 214 C 109 188, 108 162, 104 136"/>
      </g>
      <circle class="lit-line venus" data-line="venus" cx="62" cy="194" r="18" fill="url(#venusGlow)"/>
      <g filter="url(#glow)" fill="none" stroke-width="2.4" stroke-linecap="round">
        <path class="lit-line" data-line="heart" pathLength="1" stroke="#f2788a" d="M158 142 C 140 130, 112 140, 84 124"/>
        <path class="lit-line" data-line="life" pathLength="1" stroke="#e3be74" d="M58 150 C 74 170, 70 194, 90 214"/>
        <path class="lit-line" data-line="fate" pathLength="1" stroke="#e3be74" d="M112 214 C 109 188, 108 162, 104 136"/>
      </g>
    </svg>
    <div class="scanline"></div>
  </div>

  <div class="readout" aria-live="polite">
    <div class="row">
      <p class="status" id="status">Detectando mano…</p>
      <p class="pct"><span id="pct">0</span>%</p>
    </div>
    <div class="bar"><span id="barFill"></span></div>
  </div>
  <p class="hint" id="hint">Mantén el celular cerca de la mano</p>

  <ol class="readings" id="readings" hidden></ol>
  <button class="cta" id="reveal" type="button" hidden>Revelar mi destino</button>

  <p class="foot">Lectura certificada por las estrellas ✦</p>
</main>

<section class="destino" id="destino" hidden role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <canvas id="hearts"></canvas>
  <div class="carta">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 34 C 12 28, 4 22, 4 14 C 4 8, 9 5, 13 5 C 16.5 5, 19 7, 20 10 C 21 7, 23.5 5, 27 5 C 31 5, 36 8, 36 14 C 36 22, 28 28, 20 34 Z" fill="#f2788a" stroke="#e3be74" stroke-width="1.4"/>
    </svg>
    <p class="eyebrow" id="dEyebrow"></p>
    <h2 id="dTitle"></h2>
    <p class="dtext" id="dText"></p>
    <p class="compat"><span id="compatLabel"></span> <b id="compat">0</b></p>
    <p class="firma" id="dFirma"></p>
    <button class="again" id="again" type="button">Leer otra vez</button>
  </div>
</section>

<script>
/* ============================================================
   EDITA AQUÍ LOS TEXTOS
   - "en" es el porcentaje del escaneo en el que aparece cada cosa.
   - "linea" debe ser: heart, life, venus o fate.
   ============================================================ */
const CONFIG = {
  duracionMs: 7000,
  estados: [
    { en: 0,   texto: "Detectando mano…" },
    { en: 14,  texto: "Mano detectada: Eduardo" },
    { en: 30,  texto: "Leyendo la línea del corazón…" },
    { en: 48,  texto: "Revisando la línea de la vida…" },
    { en: 64,  texto: "Midiendo el Monte de Venus…" },
    { en: 80,  texto: "Consultando a las estrellas…" },
    { en: 100, texto: "Lectura completa" }
  ],
  lecturas: [
    { linea: "heart", en: 34, nombre: "Línea del corazón", texto: "Ocupada al cien por ciento. Tiene un nombre escrito clarito: Vane." },
    { linea: "life",  en: 52, nombre: "Línea de la vida",  texto: "Larga y llena de dulces. Ya decidió con quién compartirlos." },
    { linea: "venus", en: 68, nombre: "Monte de Venus",    texto: "Desbordado. Diagnóstico: perdidamente enamorado." },
    { linea: "fate",  en: 86, nombre: "Línea del destino", texto: "Salió a buscar el One Piece… y resulta que eras tú." }
  ],
  final: {
    etiqueta: "Tu destino",
    titulo: "Esta mano ya tiene",
    tituloResaltado: "dueña",
    texto: "Vane, las estrellas dicen que hay algo para ti en el bolsillo izquierdo de Eduardo.",
    compatibilidad: "Compatibilidad:",
    firma: "Te quiero, mi chicharrón prensado."
  }
};

(function(){
  const $ = s => document.querySelector(s);
  let reduce = false;
  try { reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e) {}

  const seal = $("#seal"), statusEl = $("#status"), pctEl = $("#pct"), fill = $("#barFill"),
        hint = $("#hint"), list = $("#readings"), btn = $("#reveal"), destino = $("#destino"),
        compatEl = $("#compat");

  try {
    const f = new Intl.DateTimeFormat("es-MX", { day: "numeric", month: "long" }).format(new Date());
    $("#fecha").textContent = " · " + f;
  } catch(e) {}

  const items = CONFIG.lecturas.map(l => {
    const li = document.createElement("li");
    li.className = "reading"; li.dataset.line = l.linea; li.hidden = true;
    const s = document.createElement("span"); s.className = "label"; s.textContent = l.nombre;
    const p = document.createElement("p"); p.textContent = l.texto;
    li.append(s, p); list.append(li);
    return li;
  });

  const F = CONFIG.final;
  $("#dEyebrow").textContent = F.etiqueta;
  const em = document.createElement("em"); em.textContent = F.tituloResaltado;
  $("#dTitle").append(F.titulo + " ", em);
  $("#dText").textContent = F.texto;
  $("#compatLabel").textContent = F.compatibilidad;
  $("#dFirma").textContent = F.firma;

  let timers = [], raf = 0;
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const clearAll = () => { timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); };
  const lines = name => document.querySelectorAll('.lit-line[data-line="' + name + '"]');
  const lit = (name, on) => lines(name).forEach(el => el.classList.toggle("lit", on));
  const pulse = name => lines(name).forEach(el => { el.classList.remove("pulse"); el.getBoundingClientRect(); el.classList.add("pulse"); });
  const reveal = el => {
    const r = el.getBoundingClientRect();
    const over = r.bottom - window.innerHeight + 28;
    if (over > 0) window.scrollBy({ top: over, behavior: reduce ? "auto" : "smooth" });
  };

  function runScan(){
    clearAll();
    items.forEach(li => li.hidden = true);
    list.hidden = true; btn.hidden = true; hint.hidden = false;
    CONFIG.lecturas.forEach(l => lit(l.linea, false));
    seal.classList.add("scanning");
    const dur = reduce ? 1200 : CONFIG.duracionMs;
    const start = performance.now();
    let last = -1;
    const tick = now => {
      const p = Math.min(1, (now - start) / dur);
      const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const pct = Math.round(e * 100);
      pctEl.textContent = pct;
      fill.style.width = pct + "%";
      let idx = 0;
      CONFIG.estados.forEach((s, i) => { if (pct >= s.en) idx = i; });
      if (idx !== last) { statusEl.textContent = CONFIG.estados[idx].texto; last = idx; }
      CONFIG.lecturas.forEach(l => { if (pct >= l.en) lit(l.linea, true); });
      if (p < 1) raf = requestAnimationFrame(tick); else done();
    };
    raf = requestAnimationFrame(tick);
  }

  function done(){
    seal.classList.remove("scanning");
    hint.hidden = true; list.hidden = false;
    const gap = reduce ? 150 : 1100;
    items.forEach((li, i) => later(() => {
      li.hidden = false; pulse(li.dataset.line); reveal(li);
    }, 400 + i * gap));
    later(() => { btn.hidden = false; reveal(btn); }, 400 + items.length * gap + 300);
  }

  /* Corazones del telón final */
  const cv = $("#hearts"), ctx = cv.getContext("2d");
  let hearts = [], hraf = 0, lastT = 0;
  function size(){
    const d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  function spawn(initial){
    return {
      x: Math.random() * innerWidth,
      y: initial ? Math.random() * innerHeight : -30,
      s: 12 + Math.random() * 20, v: 28 + Math.random() * 46,
      a: Math.random() * 6.28, w: .6 + Math.random() * 1.2,
      c: Math.random() < .65 ? "#f2788a" : "#e3be74",
      o: .3 + Math.random() * .5
    };
  }
  function drawHeart(h){
    ctx.save();
    ctx.globalAlpha = h.o;
    ctx.translate(h.x + Math.sin(h.a) * 12, h.y);
    ctx.rotate(Math.sin(h.a) * .3);
    ctx.scale(h.s, h.s);
    ctx.beginPath();
    ctx.moveTo(0, -.15);
    ctx.bezierCurveTo(-.05, -.45, -.5, -.45, -.5, -.1);
    ctx.bezierCurveTo(-.5, .2, -.2, .35, 0, .5);
    ctx.bezierCurveTo(.2, .35, .5, .2, .5, -.1);
    ctx.bezierCurveTo(.5, -.45, .05, -.45, 0, -.15);
    ctx.fillStyle = h.c; ctx.fill();
    ctx.restore();
  }
  function startHearts(){
    size();
    hearts = Array.from({ length: reduce ? 14 : 28 }, () => spawn(true));
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (reduce) { hearts.forEach(drawHeart); return; }
    lastT = performance.now();
    const loop = t => {
      const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      hearts.forEach(h => {
        h.y += h.v * dt; h.a += h.w * dt;
        if (h.y > innerHeight + 30) Object.assign(h, spawn(false));
        drawHeart(h);
      });
      hraf = requestAnimationFrame(loop);
    };
    hraf = requestAnimationFrame(loop);
  }
  window.addEventListener("resize", () => { if (!destino.hidden) size(); });

  function countCompat(){
    compatEl.classList.remove("inf");
    compatEl.textContent = "0%";
    const start = performance.now() + (reduce ? 0 : 700), dur = reduce ? 1 : 1600;
    const step = now => {
      const p = Math.max(0, Math.min(1, (now - start) / dur));
      compatEl.textContent = Math.round(p * 100) + "%";
      if (p < 1) requestAnimationFrame(step);
      else later(() => { compatEl.textContent = "∞"; compatEl.classList.add("inf"); }, reduce ? 0 : 650);
    };
    requestAnimationFrame(step);
  }

  btn.addEventListener("click", () => {
    destino.hidden = false;
    document.body.style.overflow = "hidden";
    try { if (navigator.vibrate) navigator.vibrate([70, 50, 70, 50, 160]); } catch(e) {}
    countCompat(); startHearts();
    try { $("#again").focus({ preventScroll: true }); } catch(e) {}
  });

  $("#again").addEventListener("click", () => {
    cancelAnimationFrame(hraf);
    destino.hidden = true;
    document.body.style.overflow = "";
    window.scrollTo(0, 0);
    runScan();
  });

  runScan();
})();
</script>
</body>
</html>
